version: '3.8'

services:
  # ===================================================
  # Core Infrastructure Services
  # ===================================================
  eureka-server:
    build:
      context: ./eureka-server
      dockerfile: Dockerfile
    ports:
      - "8761:8761"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - RENDER_EXTERNAL_HOSTNAME=eureka-server
      - PORT=8761
    networks:
      - portfolio-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8761/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  gateway-service:
    build:
      context: ./gateway-service
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - EUREKA_SERVER_URL=http://eureka-server:8761/eureka
      - JWT_SECRET=${JWT_SECRET}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=
      - FRONTEND_URL=http://localhost:5173
    networks:
      - portfolio-network
    depends_on:
      eureka-server:
        condition: service_healthy
      redis:
        condition: service_started

  # ===================================================
  # Backend Microservices
  # ===================================================
  auth-service:
    build:
      context: ./auth-service
      dockerfile: Dockerfile
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - EUREKA_SERVER_URL=http://eureka-server:8761/eureka
      - MONGO_URI=mongodb://root:admin@mongodb:27017/portfolio_auth?authSource=admin&maxPoolSize=50
      - JWT_SECRET=${JWT_SECRET}
      - ADMIN_USERNAME=${ADMIN_USERNAME}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - ADMIN_EMAIL=${ADMIN_EMAIL}
    networks:
      - portfolio-network
    depends_on:
      eureka-server:
        condition: service_healthy
      mongodb:
        condition: service_started

  profile-content-service:
    build:
      context: ./profile-content-service
      dockerfile: Dockerfile
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - EUREKA_SERVER_URL=http://eureka-server:8761/eureka
      - MONGO_URI=mongodb://root:admin@mongodb:27017/portfolio_content?authSource=admin&maxPoolSize=50
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      # Local kafka doesn't use SASL in this compose file, but prod profile expects KAFKA_USERNAME/KAFKA_PASSWORD to be present
      - KAFKA_USERNAME=test
      - KAFKA_PASSWORD=test
    networks:
      - portfolio-network
    depends_on:
      eureka-server:
        condition: service_healthy
      mongodb:
        condition: service_started
      kafka:
        condition: service_started

  media-service:
    build:
      context: ./media-service
      dockerfile: Dockerfile
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - EUREKA_SERVER_URL=http://eureka-server:8761/eureka
      - MONGO_URI=mongodb://root:admin@mongodb:27017/portfolio_media?authSource=admin&maxPoolSize=50
      - CLOUDINARY_CLOUD_NAME=${CLOUDINARY_CLOUD_NAME}
      - CLOUDINARY_API_KEY=${CLOUDINARY_API_KEY}
      - CLOUDINARY_API_SECRET=${CLOUDINARY_API_SECRET}
    networks:
      - portfolio-network
    depends_on:
      eureka-server:
        condition: service_healthy
      mongodb:
        condition: service_started

  notification-service:
    build:
      context: ./notification-service
      dockerfile: Dockerfile
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - EUREKA_SERVER_URL=http://eureka-server:8761/eureka
      - MONGO_URI=mongodb://root:admin@mongodb:27017/portfolio_notifications?authSource=admin&maxPoolSize=50
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - KAFKA_USERNAME=test
      - KAFKA_PASSWORD=test
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_USERNAME=${SMTP_USERNAME}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - SMTP_TO_EMAIL=${SMTP_TO_EMAIL}
    networks:
      - portfolio-network
    depends_on:
      eureka-server:
        condition: service_healthy
      mongodb:
        condition: service_started
      kafka:
        condition: service_started

  analytics-service:
    build:
      context: ./analytics-service
      dockerfile: Dockerfile
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - EUREKA_SERVER_URL=http://eureka-server:8761/eureka
      - MONGO_URI=mongodb://root:admin@mongodb:27017/portfolio_analytics?authSource=admin&maxPoolSize=50
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - KAFKA_USERNAME=test
      - KAFKA_PASSWORD=test
    networks:
      - portfolio-network
    depends_on:
      eureka-server:
        condition: service_healthy
      mongodb:
        condition: service_started
      kafka:
        condition: service_started

  # ===================================================
  # Simulated External Dependencies (Local)
  # ===================================================
  mongodb:
    image: mongo:latest
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=root
      - MONGO_INITDB_ROOT_PASSWORD=admin
    networks:
      - portfolio-network

  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
    networks:
      - portfolio-network

  zookeeper:
    image: confluentinc/cp-zookeeper:latest
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - portfolio-network

  kafka:
    image: confluentinc/cp-kafka:latest
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks:
      - portfolio-network

networks:
  portfolio-network:
    driver: bridge
