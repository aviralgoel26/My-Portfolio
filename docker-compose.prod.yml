version: '3.8'

services:
  # ===================================================
  # Core Infrastructure Services
  # ===================================================
  eureka-server:
    build:
      context: ./eureka-server
      dockerfile: Dockerfile
    ports:
      - "8761:8761"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - RENDER_EXTERNAL_HOSTNAME=eureka-server
      - PORT=8761
    networks:
      - portfolio-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8761/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  gateway-service:
    build:
      context: ./gateway-service
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - EUREKA_SERVER_URL=http://eureka-server:8761/eureka
      - JWT_SECRET=${JWT_SECRET}
      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PORT=${REDIS_PORT:6379}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - FRONTEND_URL=${FRONTEND_URL}
    networks:
      - portfolio-network
    depends_on:
      eureka-server:
        condition: service_healthy

  # ===================================================
  # Backend Microservices
  # ===================================================
  auth-service:
    build:
      context: ./auth-service
      dockerfile: Dockerfile
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - EUREKA_SERVER_URL=http://eureka-server:8761/eureka
      - MONGO_URI=${MONGO_URI}
      - JWT_SECRET=${JWT_SECRET}
      - ADMIN_USERNAME=${ADMIN_USERNAME}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - ADMIN_EMAIL=${ADMIN_EMAIL}
    networks:
      - portfolio-network
    depends_on:
      eureka-server:
        condition: service_healthy

  profile-content-service:
    build:
      context: ./profile-content-service
      dockerfile: Dockerfile
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - EUREKA_SERVER_URL=http://eureka-server:8761/eureka
      - MONGO_URI=${MONGO_URI}
      - APP_FEATURES_KAFKA_ENABLED=${APP_FEATURES_KAFKA_ENABLED:-false}
    networks:
      - portfolio-network
    depends_on:
      eureka-server:
        condition: service_healthy

  media-service:
    build:
      context: ./media-service
      dockerfile: Dockerfile
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - EUREKA_SERVER_URL=http://eureka-server:8761/eureka
      - MONGO_URI=${MONGO_URI}
      - CLOUDINARY_CLOUD_NAME=${CLOUDINARY_CLOUD_NAME}
      - CLOUDINARY_API_KEY=${CLOUDINARY_API_KEY}
      - CLOUDINARY_API_SECRET=${CLOUDINARY_API_SECRET}
    networks:
      - portfolio-network
    depends_on:
      eureka-server:
        condition: service_healthy

  notification-service:
    build:
      context: ./notification-service
      dockerfile: Dockerfile
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - EUREKA_SERVER_URL=http://eureka-server:8761/eureka
      - MONGO_URI=${MONGO_URI}
      - APP_FEATURES_KAFKA_ENABLED=${APP_FEATURES_KAFKA_ENABLED:-false}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_USERNAME=${SMTP_USERNAME}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - SMTP_TO_EMAIL=${SMTP_TO_EMAIL}
    networks:
      - portfolio-network
    depends_on:
      eureka-server:
        condition: service_healthy

  analytics-service:
    build:
      context: ./analytics-service
      dockerfile: Dockerfile
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - EUREKA_SERVER_URL=http://eureka-server:8761/eureka
      - MONGO_URI=${MONGO_URI}
      - APP_FEATURES_KAFKA_ENABLED=${APP_FEATURES_KAFKA_ENABLED:-false}
    networks:
      - portfolio-network
    depends_on:
      eureka-server:
        condition: service_healthy

networks:
  portfolio-network:
    driver: bridge
