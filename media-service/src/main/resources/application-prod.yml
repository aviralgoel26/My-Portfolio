# Production profile — all values MUST come from environment variables
spring:
  data:
    mongodb:
      uri: ${MONGO_URI}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL}

cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME}
  api-key: ${CLOUDINARY_API_KEY}
  api-secret: ${CLOUDINARY_API_SECRET}

logging:
  level:
    root: INFO
    com.portfolio.media: INFO
