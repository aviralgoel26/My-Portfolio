server:
  port: 8083

spring:
  application:
    name: media-service
  data:
    mongodb:
      uri: ${MONGO_URI:mongodb://admin:changeme@localhost:27017/portfolio_media?authSource=admin}
      auto-index-creation: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URI:http://localhost:8761/eureka}
    fetch-registry: true
    register-with-eureka: true
  instance:
    prefer-ip-address: true

cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME:demo}
  api-key: ${CLOUDINARY_API_KEY:demo}
  api-secret: ${CLOUDINARY_API_SECRET:demo}

management:
  endpoints:
    web:
      exposure:
        include: health,info
