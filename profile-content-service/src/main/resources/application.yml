server:
  port: 8082

spring:
  application:
    name: profile-content-service
  data:
    mongodb:
      uri: ${MONGO_URI:mongodb://admin:changeme@localhost:27017/portfolio_content?authSource=admin}
      auto-index-creation: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URI:http://localhost:8761/eureka}
    fetch-registry: true
    register-with-eureka: true
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.portfolio.content: DEBUG
