# Dev profile — uses local MongoDB via docker-compose (or localhost for IDE)
spring:
  data:
    mongodb:
      uri: ${MONGO_URI:mongodb://admin:changeme@localhost:27017/portfolio_auth?authSource=admin}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka}

jwt:
  secret: ${JWT_SECRET:dev_secret_at_least_32_characters_long_for_hmac}

app:
  admin:
    username: ${ADMIN_USERNAME:admin}
    password: ${ADMIN_PASSWORD:Admin@12345}
    email: ${ADMIN_EMAIL:admin@portfolio.com}

logging:
  level:
    com.portfolio.auth: DEBUG
    org.springframework.security: INFO
