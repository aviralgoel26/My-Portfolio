version: '3.8'

services:

  # ─── Infrastructure ─────────────────────────────────────────────────────────

  mongo:
    image: mongo:7.0
    container_name: portfolio-mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:-changeme}
    ports:
      - "6068:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - portfolio-network

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    container_name: portfolio-zookeeper
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - portfolio-network

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: portfolio-kafka
    restart: unless-stopped
    depends_on:
      - zookeeper
    ports:
      - "6069:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:6069
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    networks:
      - portfolio-network

  redis:
    image: redis:7.2-alpine
    container_name: portfolio-redis
    restart: unless-stopped
    ports:
      - "6070:6379"
    networks:
      - portfolio-network

  eureka-server:
    build: ./eureka-server
    container_name: portfolio-eureka
    restart: unless-stopped
    ports:
      - "6067:8761"
    networks:
      - portfolio-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8761/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  # ─── Backend Microservices ───────────────────────────────────────────────────

  gateway-service:
    build: ./gateway-service
    container_name: portfolio-gateway
    restart: unless-stopped
    ports:
      - "6061:8080"
    environment:
      JWT_SECRET: ${JWT_SECRET}
      REDIS_HOST: redis
      EUREKA_URI: http://eureka-server:8761/eureka
    depends_on:
      eureka-server:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - portfolio-network

  auth-service:
    build: ./auth-service
    container_name: portfolio-auth
    restart: unless-stopped
    ports:
      - "6062:8081"
    environment:
      MONGO_URI: mongodb://${MONGO_INITDB_ROOT_USERNAME:-admin}:${MONGO_INITDB_ROOT_PASSWORD:-changeme}@mongo:27017/portfolio_auth?authSource=admin
      JWT_SECRET: ${JWT_SECRET}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-AviralGoel26}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Avi@2611}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@portfolio.com}
      EUREKA_URI: http://eureka-server:8761/eureka
    depends_on:
      eureka-server:
        condition: service_healthy
      mongo:
        condition: service_started
    networks:
      - portfolio-network

  profile-content-service:
    build: ./profile-content-service
    container_name: portfolio-content
    restart: unless-stopped
    ports:
      - "6063:8082"
    environment:
      MONGO_URI: mongodb://${MONGO_INITDB_ROOT_USERNAME:-admin}:${MONGO_INITDB_ROOT_PASSWORD:-changeme}@mongo:27017/portfolio_content?authSource=admin
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      EUREKA_URI: http://eureka-server:8761/eureka
    depends_on:
      eureka-server:
        condition: service_healthy
      mongo:
        condition: service_started
      kafka:
        condition: service_started
    networks:
      - portfolio-network

  media-service:
    build: ./media-service
    container_name: portfolio-media
    restart: unless-stopped
    ports:
      - "6064:8083"
    environment:
      MONGO_URI: mongodb://${MONGO_INITDB_ROOT_USERNAME:-admin}:${MONGO_INITDB_ROOT_PASSWORD:-changeme}@mongo:27017/portfolio_media?authSource=admin
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET}
      EUREKA_URI: http://eureka-server:8761/eureka
    depends_on:
      eureka-server:
        condition: service_healthy
      mongo:
        condition: service_started
    networks:
      - portfolio-network

  analytics-service:
    build: ./analytics-service
    container_name: portfolio-analytics
    restart: unless-stopped
    ports:
      - "6065:8084"
    environment:
      MONGO_URI: mongodb://${MONGO_INITDB_ROOT_USERNAME:-admin}:${MONGO_INITDB_ROOT_PASSWORD:-changeme}@mongo:27017/portfolio_analytics?authSource=admin
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      EUREKA_URI: http://eureka-server:8761/eureka
    depends_on:
      eureka-server:
        condition: service_healthy
      mongo:
        condition: service_started
      kafka:
        condition: service_started
    networks:
      - portfolio-network

  notification-service:
    build: ./notification-service
    container_name: portfolio-notification
    restart: unless-stopped
    ports:
      - "6066:8085"
    environment:
      MONGO_URI: mongodb://${MONGO_INITDB_ROOT_USERNAME:-admin}:${MONGO_INITDB_ROOT_PASSWORD:-changeme}@mongo:27017/portfolio_notifications?authSource=admin
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_TO_EMAIL: ${SMTP_TO_EMAIL}
      EUREKA_URI: http://eureka-server:8761/eureka
    depends_on:
      eureka-server:
        condition: service_healthy
      mongo:
        condition: service_started
      kafka:
        condition: service_started
    networks:
      - portfolio-network

  # ─── Frontend ────────────────────────────────────────────────────────────────

  frontend-service:
    build: ./frontend-service
    container_name: portfolio-frontend
    restart: unless-stopped
    ports:
      - "6060:80"
    depends_on:
      - gateway-service
    networks:
      - portfolio-network

volumes:
  mongo-data:

networks:
  portfolio-network:
    driver: bridge
